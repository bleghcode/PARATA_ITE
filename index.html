<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Parata Ite</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&family=Roboto:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f5fa; --surface:#ffffff; --surface-2:#eaeef7; --line:#d6dcea;
  --ink:#121a33; --muted:#586280; --accent:#1c43a6; --accent-ink:#ffffff; --accent-soft:#e1e8fb;
  --danger:#b3261e;
  --f-display:'Prompt','IBM Plex Sans Thai',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai','Roboto',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1527; --surface:#16203a; --surface-2:#1e2a4a; --line:#2b3860;
    --ink:#e8ecf7; --muted:#9aa6c4; --accent:#86a8ff; --accent-ink:#0e1527; --accent-soft:#223463;
    --danger:#ff8f86; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding:18px 16px 48px}
.wrap{max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0}
h1{font-size:26px;letter-spacing:-.01em}
h2{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;margin-bottom:20px}
.brand{font:600 18px/1 var(--f-display);display:flex;align-items:center;gap:10px}
.brand i{width:12px;height:12px;border-radius:3px;background:var(--accent);display:inline-block}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:500}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical;line-height:1.5}
input[type=search]{width:260px;max-width:100%}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
@media (max-width:1020px){.split{grid-template-columns:1fr}}
.preview-col{position:sticky;top:12px;min-width:0}
@media (max-width:1020px){.preview-col{position:static}}
.scroll-x{overflow-x:auto}
.row-card{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.row-card+.row-card{margin-top:8px}
@media (max-width:640px){.row-card{grid-template-columns:1fr}}
.num{font:600 22px/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:13.5px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-right:6px;font-weight:500}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.empty h2{color:var(--ink);margin-bottom:6px}
.day{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}
.day-head{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.day-head b{font-family:var(--f-display);margin-right:auto}
.day-head select{width:auto;max-width:55%}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin-bottom:8px}
.pair.short{grid-template-columns:110px minmax(0,1fr) auto}
.snip{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.snip label{margin:0}
.snip select{width:auto;max-width:60%;margin-left:auto;padding:3px 8px;font-size:13px}
.banner{padding:10px 14px;border-radius:10px;background:var(--accent-soft);color:var(--ink);margin-bottom:14px;font-size:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:90vw}
.lib-list .row-card{grid-template-columns:minmax(0,1fr) auto}
.pre{white-space:pre-line}
@media (prefers-reduced-motion:no-preference){.tab,.btn{transition:background .15s,border-color .15s}}
</style>
<style id="paper-css">
.sheet{background:#fff;color:#0e1530;font:13px/1.5 'Roboto','IBM Plex Sans Thai',Arial,sans-serif;padding:28px 30px 34px;max-width:820px;margin:0 auto;border:1px solid #d3d9e8;border-radius:4px}
.sheet *{box-sizing:border-box}
.sheet .p-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sheet .p-brand{font:italic 700 30px/1 Georgia,'Times New Roman',serif;color:#2557c7}
.sheet .p-meta{text-align:right;color:#4a5470;font-size:12px}
.sheet .p-meta b{color:#0e1530;display:block}
.sheet .p-band{margin:14px 0 0;padding:12px 14px;background:#f1f5fc;border-bottom:2px solid #2e8fd6}
.sheet .p-band h2{margin:0 0 6px;font:700 22px/1.2 'Roboto',Arial,sans-serif;color:#1b3f8f}
.sheet .p-band p{margin:1px 0;font-size:12px;font-weight:500}
.sheet .p-title{margin:16px 0 8px;padding:8px 0;border-top:1px solid #2e8fd6;border-bottom:1px solid #2e8fd6;font:700 18px/1.2 'Roboto',Arial,sans-serif}
.sheet .p-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:12px;padding:5px 0}
.sheet .p-row div:first-child{color:#2b3350}
.sheet .p-rule{border:0;border-top:1px dashed #b8c0d4;margin:14px 0}
.sheet h4{margin:14px 0 4px;font:700 12px/1.3 'Roboto',Arial,sans-serif}
.sheet ul{margin:0 0 0 40px;padding:0}
.sheet li{margin:2px 0}
.sheet .p-note{font-style:italic;font-size:11px;color:#3b4460;white-space:pre-line;margin:6px 0}
.sheet .p-pre{white-space:pre-line;margin:0}
.sheet .p-terms{color:#555d75;font-size:12px;margin-top:6px}
.sheet .p-thanks{text-align:center;font:700 14px/1.4 'Roboto',Arial,sans-serif;color:#3b4460;margin-top:14px}
.sheet .p-reg{text-align:center;color:#555d75;font-size:12px}
.sheet h4,.sheet .p-row{break-inside:avoid}
@media (max-width:520px){.sheet{padding:18px 14px}.sheet .p-row{grid-template-columns:1fr;gap:0}.sheet ul{margin-left:22px}}
@media print{
  @page{margin:12mm}
  body{background:#fff;padding:0}
  .top,#banner,.head,#form,#toast{display:none!important}
  .split{display:block}
  .preview-col{position:static}
  .scroll-x{overflow:visible}
  .sheet{border:0;max-width:none;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><i></i>Parata Phatra</div>
    <nav class="tabs" id="nav" aria-label="Main menu"></nav>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>
<div id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

var CO_DEFAULT={brand:'Your Brand',name:'Your Company Co Ltd.',address:'',phones:'',email:'',location:'',regNo:''};
var TOUR_CATS=[['Pattaya','Pattaya'],['Bangkok','Bangkok'],['Transfer','Transfer'],['Other','Other']];
var CITIES=[['Bangkok','Bangkok'],['Pattaya','Pattaya'],['Other','Other']];
var SNIP_KINDS=[['hotelCond','Hotel conditions'],['meals','Meals'],['terms','Terms & Conditions'],['other','Other']];
var LIBS={
  tours:{title:'Tours & activities',hint:'Items you can add to each day of an itinerary',add:'Add item',
    fields:[['name','Item name (shown on the itinerary)','text'],['cat','Category','select',TOUR_CATS],['note','Extra text after the name (optional)','textarea']]},
  hotels:{title:'Hotels',hint:'Suggestions when entering hotels on an itinerary',add:'Add hotel',
    fields:[['name','Hotel name','text'],['city','City','select',CITIES]]},
  snippets:{title:'Standard text',hint:'Hotel conditions, meals and terms reused on every itinerary',add:'Add text',
    fields:[['title','Title','text'],['kind','Type','select',SNIP_KINDS],['body','Content','textarea']]}
};
var NAV=[['list','Itineraries'],['tours','Tours'],['hotels','Hotels'],['snippets','Standard text']];
var KINDS=['tours','hotels','snippets','itineraries'];
// Options for the Transport dropdowns. Edit these two lists to change the choices.
var ROUTES=['Bangkok to Pattaya Transport by','Pattaya to Bangkok Transport by','Bangkok Airport Drop-off by','Other Tours Travel by'];
var VEHICLES=['Car','6 Seater','9 Seater','12 Seater','Bus'];

var S={tours:[],hotels:[],snippets:[],itineraries:[],company:null,loaded:{},view:'list',editId:null,draft:null,
  saving:false,libEdit:null,delArmed:false,q:'',err:''};

/* ---------- helpers ---------- */
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true},2600)}
function lines(t){return String(t||'').split('\n').map(function(s){return s.trim()}).filter(Boolean)}
function parseD(s){var p=String(s||'').slice(0,10).split('-').map(Number);return p.length===3&&p[0]?new Date(Date.UTC(p[0],p[1]-1,p[2])):null}
function fmtDate(s){var d=parseD(s);return d?new Intl.DateTimeFormat('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric',timeZone:'UTC'}).format(d):''}
function fmtShort(s){var d=parseD(s);return d?new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(d):''}
function today(){return new Intl.DateTimeFormat('en-CA').format(new Date())}
function company(){return Object.assign({},CO_DEFAULT,S.company||{})}
function nextNumber(){return Math.max.apply(null,[1179].concat(S.itineraries.map(function(i){return +i.number||0})))+1}
function clone(o){return JSON.parse(JSON.stringify(o))}
function byName(a,b){return String(a.name||a.title||'').localeCompare(String(b.name||b.title||''))}

function newDraft(){
  var pick=function(k){var s=S.snippets.filter(function(x){return x.kind===k})[0];return s?s.body:''};
  return {number:nextNumber(),issueDate:today(),guestName:'',arrival:'',departure:'',adults:'',
    days:[{text:''}],
    transport:[],
    hotels:[],
    hotelCond:pick('hotelCond'),meals:pick('meals'),sim:'',agent:'',terms:pick('terms')};
}

/* ---------- document (preview, download, text) ---------- */
function docHTML(d,c){
  var row=function(k,v){return '<div class="p-row"><div>'+esc(k)+'</div><div>'+esc(v)+'</div></div>'};
  var days=(d.days||[]).map(function(x,i){return '<h4>Day '+(i+1)+'</h4><ul>'+lines(x.text).map(function(l){return '<li>'+esc(l)+'</li>'}).join('')+'</ul>'}).join('');
  var tr=(d.transport||[]).filter(function(p){return p.k||p.v}).map(function(p){return row(p.k,p.v)}).join('');
  var ho=(d.hotels||[]).filter(function(p){return p.v}).map(function(p){return row(p.k+' Hotel',p.v)}).join('');
  return '<div class="sheet">'+
   '<div class="p-top"><div class="p-brand">'+esc(c.brand)+'</div><div class="p-meta">'+esc(fmtDate(d.issueDate))+'<b>Itinerary Number</b><b>'+esc(d.number)+'</b></div></div>'+
   '<div class="p-band"><h2>'+esc(c.name)+'</h2>'+(c.address?'<p>'+esc(c.address)+'</p>':'')+(c.phones?'<p>Phone '+esc(c.phones)+'</p>':'')+(c.email?'<p>Email '+esc(c.email)+'</p>':'')+(c.location?'<p>'+esc(c.location)+'</p>':'')+'</div>'+
   '<div class="p-title">Travel Itinerary</div>'+
   row('Guest Name',d.guestName)+row('Arrival Date',fmtDate(d.arrival))+row('Departure Date',fmtDate(d.departure))+row('Number of Adults(>120cm)',d.adults)+
   '<hr class="p-rule">'+days+
   (tr?'<hr class="p-rule">'+tr:'')+(ho?'<hr class="p-rule">'+ho:'')+
   (d.hotelCond?'<div class="p-note">'+esc(d.hotelCond)+'</div>':'')+
   (d.meals?'<hr class="p-rule">'+'<div class="p-row"><div>Meals</div><div class="p-pre">'+esc(d.meals)+'</div></div>':'')+
   (d.sim?'<hr class="p-rule">'+row('Free Thailand Data Sim Cards',d.sim):'')+
   (d.agent?'<hr class="p-rule">'+row('Booking Agent',d.agent):'')+
   (d.terms?'<div class="p-terms p-pre">'+esc(d.terms)+'</div>':'')+
   '<div class="p-thanks">Thank you for choosing '+esc(c.brand)+'!</div>'+(c.regNo?'<div class="p-reg">'+esc(c.regNo)+'</div>':'')+
   '</div>';
}
function fullHTML(d,c){
  return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Itinerary '+esc(d.number)+'</title><style>body{margin:0;padding:16px;background:#eef1f7}'+$('#paper-css').textContent+'</style></head><body>'+docHTML(d,c)+'</body></html>';
}
function textExport(d,c){
  var o=[c.name,'Itinerary Number '+d.number,'',
    'Guest Name: '+d.guestName,'Arrival Date: '+fmtDate(d.arrival),'Departure Date: '+fmtDate(d.departure),'Number of Adults(>120cm): '+d.adults,''];
  (d.days||[]).forEach(function(x,i){o.push('Day '+(i+1));lines(x.text).forEach(function(l){o.push('- '+l)});o.push('')});
  (d.transport||[]).forEach(function(p){if(p.k||p.v)o.push(p.k+': '+p.v)});o.push('');
  (d.hotels||[]).forEach(function(p){if(p.v)o.push(p.k+' Hotel: '+p.v)});
  if(d.hotelCond)o.push('',d.hotelCond);
  if(d.meals)o.push('','Meals: '+d.meals);
  if(d.sim)o.push('','Free Thailand Data Sim Cards: '+d.sim);
  if(d.agent)o.push('Booking Agent: '+d.agent);
  if(d.terms)o.push('',d.terms);
  return o.join('\n');
}

/* ---------- data (Notion through /api) ---------- */
function api(method,url,body){
  return fetch(url,{method:method,headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j;
    })});
}
function loadKind(k){
  var url=k==='itineraries'?'/api/itineraries':'/api/lib/'+k;
  return api('GET',url).then(function(list){S[k]=list;S.loaded[k]=true;S.err=''}).catch(function(e){S.err=e.message}).then(function(){renderBanner();onData()});
}
function loadAll(){return Promise.all(KINDS.map(loadKind))}
function renderBanner(){
  $('#banner').innerHTML=S.err?'<div class="banner">Could not reach Notion: '+esc(S.err)+'</div>':'';
}

/* ---------- views ---------- */
var main=function(){return $('#main')};
var VIEWS={};

function renderNav(){
  $('#nav').innerHTML=NAV.map(function(n){
    var cur=(S.view===n[0]||(S.view==='editor'&&n[0]==='list'))?' aria-current="page"':'';
    return '<button class="tab" data-go="'+n[0]+'"'+cur+'>'+esc(n[1])+'</button>';
  }).join('');
}
function go(v){
  S.view=v;S.libEdit=null;
  try{if(v!=='editor')history.replaceState(null,'','#'+v)}catch(e){}
  render();window.scrollTo(0,0);
  if(v==='list')loadKind('itineraries');else if(LIBS[v])loadKind(v);
}
function render(){renderNav();var v=VIEWS[S.view]||VIEWS.list;v.mount()}
function onData(){var v=VIEWS[S.view];if(v&&v.refresh)v.refresh()}

VIEWS.list={
  mount:function(){
    main().innerHTML='<div class="head"><h1>Itineraries</h1><div class="actions"><input id="q" type="search" placeholder="Search by guest name or number" value="'+esc(S.q)+'"><button class="btn primary" data-act="new">+ New itinerary</button></div></div><div id="rows"></div>';
    this.refresh();
  },
  refresh:function(){
    var r=$('#rows');if(!r)return;
    if(!S.loaded.itineraries){r.innerHTML='<div class="empty">'+(S.err?'Could not load data':'Loading…')+'</div>';return}
    var q=S.q.trim().toLowerCase();
    var list=S.itineraries.slice().sort(function(a,b){return (+b.number||0)-(+a.number||0)}).filter(function(i){
      return !q||String(i.number).indexOf(q)>-1||String(i.guestName||'').toLowerCase().indexOf(q)>-1});
    if(!list.length){
      r.innerHTML=S.itineraries.length?'<div class="empty">No itineraries match your search</div>':
        '<div class="empty"><h2>No itineraries yet</h2><p>Click “New itinerary” to create the first one. Saved itineraries are stored in Notion and can be reopened, edited or duplicated.</p></div>';
      return;
    }
    r.innerHTML=list.map(function(i){
      return '<div class="row-card"><div class="num">'+esc(i.number)+'</div><div style="min-width:0"><b>'+esc(i.guestName||'(No guest name)')+'</b>'+
        '<div class="sub">'+esc(fmtShort(i.arrival))+' – '+esc(fmtShort(i.departure))+' · '+esc(i.adults)+' adults · '+esc(i.days)+' days</div>'+
        (i.hotelsText?'<div class="sub">'+esc(i.hotelsText)+'</div>':'')+'</div>'+
        '<div class="actions"><button class="btn small" data-act="open" data-id="'+esc(i.id)+'">Open</button>'+
        '<button class="btn small" data-act="dup" data-id="'+esc(i.id)+'">Duplicate</button></div></div>';
    }).join('');
  }
};

function tourOptions(){
  var cats=TOUR_CATS.map(function(c){
    var items=S.tours.filter(function(t){return (t.cat||'Other')===c[0]}).sort(byName);
    return items.length?'<optgroup label="'+esc(c[1])+'">'+items.map(function(t){return '<option value="'+esc(t.id)+'">'+esc(t.name)+'</option>'}).join('')+'</optgroup>':'';
  }).join('');
  return '<option value="">Choose a tour</option>'+cats;
}
function snipSelect(field,kind){
  var items=S.snippets.filter(function(s){return s.kind===kind});
  if(!items.length)return '';
  return '<select data-snip="'+field+'" aria-label="Insert standard text"><option value="">Insert standard text</option>'+items.map(function(s){return '<option value="'+esc(s.id)+'">'+esc(s.title)+'</option>'}).join('')+'</select>';
}
function daysHTML(){
  var opts=tourOptions();
  return S.draft.days.map(function(d,i){
    return '<div class="day"><div class="day-head"><b>Day '+(i+1)+'</b><select data-tour="'+i+'" aria-label="Choose tour for Day '+(i+1)+'">'+opts+'</select>'+
      '<button class="btn small" data-act="addTour" data-i="'+i+'">Add</button>'+
      (S.draft.days.length>1?'<button class="btn small danger" data-act="rmDay" data-i="'+i+'" aria-label="Remove Day '+(i+1)+'">Remove</button>':'')+'</div>'+
      '<textarea id="day-'+i+'" data-day="'+i+'" rows="5" placeholder="One item per line">'+esc(d.text)+'</textarea></div>';
  }).join('');
}
function selHTML(attrs,list,cur,ph){
  var opts=list.slice();if(cur&&opts.indexOf(cur)<0)opts.unshift(cur);
  return '<select '+attrs+'><option value="">'+ph+'</option>'+opts.map(function(o){return '<option'+(o===cur?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>';
}
function pairsHTML(key){
  var hot=key==='hotels';
  if(!S.draft[key].length)return '<div class="sub">'+(hot?'No hotels added yet.':'No transport added yet.')+'</div>';
  return S.draft[key].map(function(p,i){
    var base='data-pair="'+key+'" data-i="'+i+'"';
    var f1=hot?'<input '+base+' data-k="k" value="'+esc(p.k)+'" placeholder="City" aria-label="City">':selHTML(base+' data-k="k" aria-label="Route"',ROUTES,p.k,'Select route');
    var f2=hot?'<input '+base+' data-k="v" value="'+esc(p.v)+'" placeholder="Hotel name" aria-label="Hotel name" list="hotelNames">':selHTML(base+' data-k="v" aria-label="Vehicle"',VEHICLES,p.v,'Select vehicle');
    return '<div class="pair'+(hot?' short':'')+'">'+f1+f2+'<button class="btn small danger" data-act="rmPair" data-key="'+key+'" data-i="'+i+'" aria-label="Remove row">Remove</button></div>';
  }).join('');
}
function fld(label,id,f,type,extra){
  return '<div><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+(type||'text')+'" data-f="'+f+'" value="'+esc(S.draft[f])+'" '+(extra||'')+'></div>';
}
function area(label,id,f,kind,rows){
  return '<div><div class="snip"><label for="'+id+'">'+label+'</label>'+(kind?snipSelect(f,kind):'')+'</div><textarea id="'+id+'" data-f="'+f+'" rows="'+(rows||4)+'">'+esc(S.draft[f])+'</textarea></div>';
}
VIEWS.editor={
  mount:function(){
    var d=S.draft;if(!d){go('list');return}
    var hotelNames=S.hotels.slice().sort(byName).map(function(h){return '<option value="'+esc(h.name)+'">'}).join('');
    main().innerHTML=
     '<div class="head"><h1>'+(S.editId?'Edit itinerary '+esc(d.number):'New itinerary')+'</h1><div class="actions">'+
       '<button class="btn" data-act="back">Back</button>'+
       '<button class="btn" data-act="print">Print / Save as PDF</button>'+
       '<button class="btn" data-act="download">Download .html</button>'+
       '<button class="btn" data-act="copy">Copy as text</button>'+
       (S.editId?'<button class="btn danger" data-act="delete">Delete itinerary</button>':'')+
       '<button class="btn primary" data-act="save">Save</button></div></div>'+
     '<datalist id="hotelNames">'+hotelNames+'</datalist>'+
     '<div class="split"><div class="stack" id="form">'+
       '<section class="card stack"><h2>Guest details</h2><div class="grid2">'+fld('Itinerary number','f-number','number','number')+fld('Issue date','f-issue','issueDate','date')+'</div>'+
         fld('Guest name','f-guest','guestName')+
         '<div class="grid3">'+fld('Arrival date','f-arr','arrival','date')+fld('Departure date','f-dep','departure','date')+fld('Adults (>120 cm)','f-adults','adults','number','min="1"')+'</div></section>'+
       '<section class="card stack"><div class="head" style="margin:0"><h2>Daily program</h2><button class="btn small" data-act="genDays">Set days from dates</button></div><div class="stack" id="days">'+daysHTML()+'</div><div><button class="btn small" data-act="addDay">+ Add day</button></div></section>'+
       '<section class="card stack"><h2>Transport</h2><div id="transport">'+pairsHTML('transport')+'</div><div><button class="btn small" data-act="addPair" data-key="transport">+ Add transport</button></div></section>'+
       '<section class="card stack"><h2>Hotels</h2><div id="hotels">'+pairsHTML('hotels')+'</div><div><button class="btn small" data-act="addPair" data-key="hotels">+ Add hotel</button></div>'+
         area('Hotel booking conditions','f-hc','hotelCond','hotelCond',6)+'</section>'+
       '<section class="card stack"><h2>Meals & other</h2>'+area('Meals','f-meals','meals','meals',4)+
         '<div class="grid2">'+fld('Free Thailand Data Sim Cards','f-sim','sim')+fld('Booking Agent','f-agent','agent')+'</div>'+
         area('Terms & Conditions','f-terms','terms','terms',5)+'</section>'+
     '</div><div class="preview-col"><div class="scroll-x" id="preview"></div></div></div>';
    this.preview();
  },
  preview:function(){var p=$('#preview');if(p)p.innerHTML=docHTML(S.draft,company())},
  refresh:null
};

function libSummary(kind,it){
  if(kind==='tours')return '<b>'+esc(it.name)+'</b><div class="sub"><span class="chip">'+esc(it.cat||'Other')+'</span>'+esc(it.note||'')+'</div>';
  if(kind==='hotels')return '<b>'+esc(it.name)+'</b><div class="sub"><span class="chip">'+esc(it.city||'Other')+'</span></div>';
  var kl=(SNIP_KINDS.filter(function(k){return k[0]===it.kind})[0]||[0,'Other'])[1];
  return '<b>'+esc(it.title)+'</b><div class="sub"><span class="chip">'+esc(kl)+'</span>'+esc(String(it.body||'').slice(0,110))+(String(it.body||'').length>110?'…':'')+'</div>';
}
function makeLib(kind){
  var L=LIBS[kind];
  return {
    mount:function(){
      var form=L.fields.map(function(f){
        var id='lf-'+f[0];
        if(f[2]==='select')return '<div><label for="'+id+'">'+f[1]+'</label><select id="'+id+'">'+f[3].map(function(o){return '<option value="'+o[0]+'">'+esc(o[1])+'</option>'}).join('')+'</select></div>';
        if(f[2]==='textarea')return '<div><label for="'+id+'">'+f[1]+'</label><textarea id="'+id+'" rows="4"></textarea></div>';
        return '<div><label for="'+id+'">'+f[1]+'</label><input id="'+id+'"></div>';
      }).join('');
      main().innerHTML='<div class="head"><div><h1>'+esc(L.title)+'</h1><div class="sub">'+esc(L.hint)+'</div></div></div>'+
        '<section class="card stack" style="margin-bottom:16px"><h2 id="lib-form-title">'+esc(L.add)+'</h2>'+form+'<div class="actions"><button class="btn primary" data-act="libSave">Save</button><button class="btn" data-act="libCancel" id="libCancel" hidden>Cancel edit</button></div></section>'+
        '<div class="lib-list" id="lib"></div>';
      this.refresh();
    },
    refresh:function(){
      var r=$('#lib');if(!r)return;
      if(!S.loaded[kind]){r.innerHTML='<div class="empty">'+(S.err?'Could not load data':'Loading…')+'</div>';return}
      var list=S[kind].slice().sort(byName);
      if(!list.length){r.innerHTML='<div class="empty"><h2>No items yet</h2><p>Add the first one using the form above.</p></div>';return}
      r.innerHTML=list.map(function(it){
        return '<div class="row-card"><div style="min-width:0" class="pre">'+libSummary(kind,it)+'</div><div class="actions"><button class="btn small" data-act="libEdit" data-id="'+esc(it.id)+'">Edit</button><button class="btn small danger" data-act="libDel" data-id="'+esc(it.id)+'">Delete</button></div></div>';
      }).join('');
    }
  };
}
VIEWS.tours=makeLib('tours');VIEWS.hotels=makeLib('hotels');VIEWS.snippets=makeLib('snippets');

/* ---------- actions ---------- */
function guard(fn){
  if(S.saving)return;S.saving=true;
  Promise.resolve().then(fn).catch(function(e){toast('Failed: '+(e&&e.message||'please try again'))}).then(function(){S.saving=false});
}
function openDraft(d,id){S.draft=d;S.editId=id||null;S.delArmed=false;S.view='editor';render();window.scrollTo(0,0)}
function genDays(){
  var a=parseD(S.draft.arrival),b=parseD(S.draft.departure);
  if(!a||!b||b<a){toast('Enter valid arrival and departure dates first');return}
  var n=Math.min(Math.round((b-a)/864e5)+1,30);
  while(S.draft.days.length<n)S.draft.days.push({text:''});
  S.draft.days.length=Math.max(n,1);
  $('#days').innerHTML=daysHTML();VIEWS.editor.preview();
}
function refreshPairs(key){$('#'+key).innerHTML=pairsHTML(key)}

document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');if(g){go(g.getAttribute('data-go'));return}
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.getAttribute('data-act'),i=+b.getAttribute('data-i'),id=b.getAttribute('data-id'),key=b.getAttribute('data-key');
  if(a==='new'){openDraft(newDraft(),null)}
  else if(a==='open'){guard(function(){return api('GET','/api/itineraries/'+id).then(function(d){openDraft(d,id)})})}
  else if(a==='dup'){guard(function(){return api('GET','/api/itineraries/'+id).then(function(d){d.number=nextNumber();d.issueDate=today();d.guestName='';openDraft(d,null)})})}
  else if(a==='back'){go('list')}
  else if(a==='addDay'){S.draft.days.push({text:''});$('#days').innerHTML=daysHTML();VIEWS.editor.preview()}
  else if(a==='rmDay'){S.draft.days.splice(i,1);$('#days').innerHTML=daysHTML();VIEWS.editor.preview()}
  else if(a==='genDays'){genDays()}
  else if(a==='addTour'){
    var sel=$('[data-tour="'+i+'"]');var t=S.tours.filter(function(x){return x.id===(sel&&sel.value)})[0];
    if(!t){toast('Choose a tour first');return}
    var line=t.name+(t.note?' '+t.note:'');var cur=S.draft.days[i].text.replace(/\s+$/,'');
    S.draft.days[i].text=(cur?cur+'\n':'')+line;$('#days').innerHTML=daysHTML();VIEWS.editor.preview();
  }
  else if(a==='addPair'){S.draft[key].push({k:'',v:''});refreshPairs(key)}
  else if(a==='rmPair'){S.draft[key].splice(i,1);refreshPairs(key);VIEWS.editor.preview()}
  else if(a==='save'){guard(function(){
    var d=clone(S.draft);d.number=+d.number||d.number;d.adults=+d.adults||0;
    var req=S.editId?api('PUT','/api/itineraries/'+S.editId,d):api('POST','/api/itineraries',d).then(function(r){S.editId=r.id});
    return req.then(function(){
      toast('Saved to Notion');
      var h=$('.head h1');if(h)h.textContent='Edit itinerary '+d.number;
      var del=$('[data-act="delete"]');if(!del){var act=$('.head .actions'),pr=$('[data-act="save"]');var nb=document.createElement('button');nb.className='btn danger';nb.setAttribute('data-act','delete');nb.textContent='Delete itinerary';act.insertBefore(nb,pr)}
      loadKind('itineraries');
    });
  })}
  else if(a==='delete'){
    if(!S.delArmed){S.delArmed=true;b.textContent='Click again to confirm';setTimeout(function(){S.delArmed=false;if(b.isConnected)b.textContent='Delete itinerary'},4000)}
    else guard(function(){return api('DELETE','/api/itineraries/'+S.editId).then(function(){toast('Deleted');S.draft=null;S.editId=null;S.loaded.itineraries=false;go('list')})})
  }
  else if(a==='print'){window.print()}
  else if(a==='download'){
    var d2=S.draft;var blob=new Blob([fullHTML(d2,company())],{type:'text/html'});
    var url=URL.createObjectURL(blob);var lk=document.createElement('a');
    lk.href=url;lk.download='Itinerary-'+d2.number+'-'+String(d2.guestName||'guest').replace(/[^A-Za-z0-9ก-๙]+/g,'_')+'.html';
    document.body.appendChild(lk);lk.click();lk.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000);
  }
  else if(a==='copy'){
    var txt=textExport(S.draft,company());
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast('Copied. Paste it into your chat.')}).catch(function(){toast('Could not copy. Use Download instead.')});
  }
  else if(a==='libSave'){guard(function(){
    var kind=S.view,L=LIBS[kind],data={};
    L.fields.forEach(function(f){data[f[0]]=$('#lf-'+f[0]).value.trim()});
    if(!data[L.fields[0][0]]){toast('Enter a name first');return}
    var base='/api/lib/'+kind;
    var req=S.libEdit?api('PUT',base+'/'+S.libEdit,data):api('POST',base,data);
    return req.then(function(){
      S.libEdit=null;L.fields.forEach(function(f){var el=$('#lf-'+f[0]);if(f[2]!=='select')el.value=''});
      $('#libCancel').hidden=true;$('#lib-form-title').textContent=L.add;toast('Saved to Notion');
      return loadKind(kind);
    });
  })}
  else if(a==='libEdit'){
    var kind2=S.view,it2=S[kind2].filter(function(x){return x.id===id})[0];if(!it2)return;
    S.libEdit=id;LIBS[kind2].fields.forEach(function(f){$('#lf-'+f[0]).value=it2[f[0]]||''});
    $('#libCancel').hidden=false;$('#lib-form-title').textContent='Edit item';$('#lf-'+LIBS[kind2].fields[0][0]).focus();
  }
  else if(a==='libCancel'){
    var L2=LIBS[S.view];S.libEdit=null;L2.fields.forEach(function(f){if(f[2]!=='select')$('#lf-'+f[0]).value=''});$('#libCancel').hidden=true;$('#lib-form-title').textContent=L2.add;
  }
  else if(a==='libDel'){
    if(b.getAttribute('data-armed')!=='1'){b.setAttribute('data-armed','1');b.textContent='Confirm';setTimeout(function(){if(b.isConnected){b.removeAttribute('data-armed');b.textContent='Delete'}},4000)}
    else guard(function(){var kind=S.view;return api('DELETE','/api/lib/'+kind+'/'+id).then(function(){toast('Deleted');return loadKind(kind)})});
  }
});

document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){S.q=t.value;VIEWS.list.refresh();return}
  if(S.view!=='editor'||!S.draft)return;
  if(t.hasAttribute('data-f')){S.draft[t.getAttribute('data-f')]=t.value}
  else if(t.hasAttribute('data-day')){S.draft.days[+t.getAttribute('data-day')].text=t.value}
  else if(t.hasAttribute('data-pair')){S.draft[t.getAttribute('data-pair')][+t.getAttribute('data-i')][t.getAttribute('data-k')]=t.value}
  else return;
  cancelAnimationFrame(S.raf);S.raf=requestAnimationFrame(function(){VIEWS.editor.preview()});
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.hasAttribute('data-snip')){
    var s=S.snippets.filter(function(x){return x.id===t.value})[0];if(!s)return;
    var f=t.getAttribute('data-snip');S.draft[f]=s.body||'';
    var ta=$('[data-f="'+f+'"]');if(ta)ta.value=S.draft[f];t.value='';VIEWS.editor.preview();
  }
});
window.addEventListener('hashchange',function(){
  var h=location.hash.slice(1);if(VIEWS[h]&&h!=='editor'&&h!==S.view){S.view=h;render()}
});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&S.view!=='editor'){if(S.view==='list')loadKind('itineraries');else if(LIBS[S.view])loadKind(S.view)}
});

/* ---------- start ---------- */
(function(){
  var h=location.hash.slice(1);if(VIEWS[h]&&h!=='editor')S.view=h;
  render();
  fetch('/company.json').then(function(r){return r.ok?r.json():null}).then(function(c){
    if(c){S.company=c;if(S.view==='editor')VIEWS.editor.preview()}
  }).catch(function(){});
  loadAll();
})();
})();
</script>
</body>
