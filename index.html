<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Parata Phattra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&family=Roboto:wght@400;500;700&display=swap">
<style>
:root{
  /* company palette: 231F20 ink, EDF7F6 mint, F3A068 orange, FCEA4A yellow, 506DE2 blue */
  --bg:#edf7f6; --surface:#ffffff; --surface-2:#e1efed; --line:#c6dad7;
  --ink:#231f20; --muted:#5a5a5c; --accent:#3f5bd0; --accent-ink:#ffffff; --accent-soft:#dde4fb;
  --btn-bg:#506de2; --btn-ink:#ffffff; --hi:#fcea4a; --hi-ink:#231f20; --warm:#f3a068; --warm-soft:#fbe3d2; --warm-ink:#6b3412;
  --danger:#b3261e;
  --f-display:'Prompt','IBM Plex Sans Thai',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai','Roboto',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1819; --surface:#2a2627; --surface-2:#352f31; --line:#4a4346;
    --ink:#edf7f6; --muted:#a9b8b6; --accent:#8fa3f3; --accent-ink:#231f20; --accent-soft:#2f3558;
    --btn-bg:#fcea4a; --btn-ink:#231f20; --warm-soft:#4a3426; --warm-ink:#f3a068;
    --danger:#ff8f86; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#1b1819; --surface:#2a2627; --surface-2:#352f31; --line:#4a4346;
    --ink:#edf7f6; --muted:#a9b8b6; --accent:#8fa3f3; --accent-ink:#231f20; --accent-soft:#2f3558;
    --btn-bg:#fcea4a; --btn-ink:#231f20; --warm-soft:#4a3426; --warm-ink:#f3a068;
    --danger:#ff8f86; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding:22px 16px 48px;border-top:6px solid;border-image:linear-gradient(90deg,#506de2 0 34%,#f3a068 34% 67%,#fcea4a 67%) 1}
.wrap{max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0}
h1{font-size:26px;letter-spacing:-.01em}
h2{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;margin-bottom:20px}
.brand{font:600 18px/1 var(--f-display);display:flex;align-items:center;gap:10px}
.brand i{width:12px;height:12px;border-radius:3px;background:var(--warm);display:inline-block}
.theme-btn{margin-left:auto}
.ver{font:500 12px/1 var(--f-body);color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:500}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--hi);color:var(--hi-ink);font-weight:600}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical;line-height:1.5}
input[type=search]{width:260px;max-width:100%}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid-name{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
@media (max-width:1020px){.split{grid-template-columns:1fr}}
.preview-col{position:sticky;top:12px;min-width:0}
@media (max-width:1020px){.preview-col{position:static}}
.scroll-x{overflow-x:auto}
.row-card{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.row-card+.row-card{margin-top:8px}
@media (max-width:640px){.row-card{grid-template-columns:1fr}}
.num{font:600 22px/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:13.5px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--warm-soft);color:var(--warm-ink);margin-right:6px;font-weight:500}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.empty h2{color:var(--ink);margin-bottom:6px}
.day{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}
.day-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.day-head input[type=time]{width:auto}
.day-head b{font-family:var(--f-display);margin-right:auto}
.day-head select{width:auto;max-width:55%}
.gl-row{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin-bottom:8px;align-items:center}
.gl-row.gl-head{font-size:13px;color:var(--muted);margin-bottom:4px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin-bottom:8px}
.pair.short{grid-template-columns:110px minmax(0,1fr) auto}
.snip{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.snip label{margin:0}
.snip select{width:auto;max-width:60%;margin-left:auto;padding:3px 8px;font-size:13px}
.banner{padding:10px 14px;border-radius:10px;background:var(--accent-soft);color:var(--ink);margin-bottom:14px;font-size:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:90vw}
.lib-list .row-card{grid-template-columns:minmax(0,1fr) auto}
.pre{white-space:pre-line}
@media (prefers-reduced-motion:no-preference){.tab,.btn{transition:background .15s,border-color .15s}}
</style>
<style id="paper-css">
.sheet{background:#fff;color:#0e1530;font:13px/1.5 'Roboto','IBM Plex Sans Thai',Arial,sans-serif;padding:28px 30px 34px;max-width:820px;margin:0 auto;border:1px solid #d3d9e8;border-radius:4px}
.sheet *{box-sizing:border-box}
.sheet .p-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sheet .p-brand{font:italic 700 30px/1 Georgia,'Times New Roman',serif;color:#2557c7}
.sheet .p-meta{text-align:right;color:#4a5470;font-size:12px}
.sheet .p-meta b{color:#0e1530;display:block}
.sheet .p-band{margin:14px 0 0;padding:10px 24px;background:#fffafa url(/assets/header-band.jpg) center/100% 100% no-repeat;aspect-ratio:898/189;display:flex;flex-direction:column;justify-content:center}
.sheet .p-band h2{margin:0 0 10px;font:700 22px/1.2 'Roboto',Arial,sans-serif;color:#1b3f8f}
.sheet .p-band p{margin:2px 0;font-size:12px;font-weight:600;color:#000}
.sheet .p-days{position:relative;isolation:isolate}
.sheet .p-days::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:url(/assets/day-watermark.jpg) var(--wm-x,100%) var(--wm-y,55%)/var(--wm-s,100%) auto no-repeat;opacity:var(--wm-o,.4)}
.sheet .p-band,.sheet .p-days,.sheet .p-days::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .p-title{margin:16px 0 8px;padding:8px 0;border-top:1px solid #2e8fd6;border-bottom:1px solid #2e8fd6;font:700 18px/1.2 'Roboto',Arial,sans-serif}
.sheet .p-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:12px;padding:5px 0}
.sheet .p-row div:first-child{color:#2b3350}
.sheet .p-gl-title{font-weight:700;margin:0 0 6px}
.sheet .p-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.sheet .p-tbl th,.sheet .p-tbl td{border:1px solid #b8c0d4;padding:4px 8px;text-align:left;vertical-align:top}
.sheet .p-tbl th{background:#f1f5fc;font-weight:700}
.sheet .p-tbl th:first-child,.sheet .p-tbl td:first-child{width:44px;text-align:center}
.sheet .p-tbl tr{break-inside:avoid}
.sheet .p-rule{border:0;border-top:1px dashed #b8c0d4;margin:14px 0}
.sheet h4{margin:0 0 4px;font:700 13px/1.3 'Roboto',Arial,sans-serif}
.sheet .p-day{margin:18px 0 0;break-inside:avoid}
.sheet .p-ln{display:grid;grid-template-columns:118px minmax(0,1fr);gap:6px;padding:1px 0}
.sheet .p-t{color:#2b3350}
.sheet .p-x::before{content:'\2022\00a0\00a0'}
.sheet .p-x.p-sub{margin-left:16px}
.sheet .p-x.p-sub::before{content:'-\00a0\00a0'}
.sheet ul{margin:0 0 0 40px;padding:0}
.sheet li{margin:2px 0}
.sheet .p-note{font-style:italic;font-size:11px;color:#3b4460;white-space:pre-line;margin:6px 0}
.sheet .p-pre{white-space:pre-line;margin:0}
.sheet .p-terms{color:#555d75;font-size:12px;margin-top:6px}
.sheet .p-thanks{text-align:center;font:700 14px/1.4 'Roboto',Arial,sans-serif;color:#3b4460;margin-top:14px}
.sheet .p-reg{text-align:center;color:#555d75;font-size:12px}
.sheet .p-row{break-inside:avoid}
@media (max-width:520px){.sheet{padding:18px 14px}.sheet .p-row{grid-template-columns:1fr;gap:0}.sheet ul{margin-left:22px}}
@media print{
  @page{margin:12mm}
  body{background:#fff;padding:0;border:0}
  .top,#banner,.head,#form,#toast{display:none!important}
  .split{display:block}
  .preview-col{position:static}
  .scroll-x{overflow:visible}
  .sheet{border:0;max-width:none;padding:0}
}
</style>
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><i></i>Parata Ite <span class="ver" id="ver"></span></div>
    <nav class="tabs" id="nav" aria-label="Main menu"></nav>
    <button class="btn small theme-btn" id="themeBtn" type="button"></button>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>
<div id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

// PRITE = PARATA Itinerary. Raise this number with every change and note it in CHANGELOG.md.
var VERSION='PRITE V.1.5.2';
// Pattern behind the DAY section (paper preview, print, .html and PDF all use these four numbers):
//   x = left/right position, 0 = left edge, 100 = right edge
//   y = up/down position,    0 = top,       100 = bottom      (smaller number = pattern sits lower on the page)
//   size = width of the picture as % of the section width
//   opacity = 1 is full strength, 0.4 is 40 % strength, 0 hides it
var WM={x:100,y:55,size:90,opacity:0.10};
var CO_DEFAULT={brand:'Your Brand',name:'Your Company Co Ltd.',address:'',phones:'',email:'',location:'',regNo:''};
var TOUR_CATS=[['Pattaya','Pattaya'],['Bangkok','Bangkok'],['Phuket','Phuket'],['Transfer','Transfer'],['Kanchanaburi','Kanchanaburi'],['Meals','Meals'],['Other','Other']];
var CITIES=[['Pattaya','Pattaya'],['Bangkok','Bangkok'],['Phuket','Phuket'],['Other','Other']];
var SNIP_KINDS=[['hotelCond','Hotel conditions'],['meals','Meals'],['terms','Terms & Conditions'],['prefix','Name prefix (Mr., Mrs. ...)'],['agent','Booking agent'],['other','Other']];
var LIBS={
  tours:{title:'Tours & activities',hint:'Items you can add to each day of an itinerary',add:'Add item',
    fields:[['name','Item name (shown on the itinerary)','text'],['cat','Category','select',TOUR_CATS],['note','Extra text after the name (optional)','textarea']]},
  hotels:{title:'Hotels',hint:'Suggestions when entering hotels on an itinerary',add:'Add hotel',
    fields:[['name','Hotel name','text'],['city','City','select',CITIES]]},
  snippets:{title:'Standard text',hint:'Hotel conditions, meals and terms reused on every itinerary',add:'Add text',
    fields:[['title','Title','text'],['kind','Type','select',SNIP_KINDS],['body','Content','textarea']]}
};
var NAV=[['list','Itineraries'],['tours','Tours'],['hotels','Hotels'],['snippets','Standard text']];
var KINDS=['tours','hotels','snippets','itineraries'];
// Options for the Transport dropdowns. Edit these two lists to change the choices.
var ROUTES=['Bangkok Airport Pick-up by','Bangkok to Pattaya Transport by','Pattaya to Bangkok Transport by','Bangkok Airport Drop-off by','Other Tours Travel by'];
var VEHICLES=['Car','Van','6 Seater','9 Seater','12 Seater','Bus'];
// Sales staff shown in the Booking Agent dropdown. Add each person's name to this list.
var AGENTS=['Dhanuka','Ramesh'];

var S={tours:[],hotels:[],snippets:[],itineraries:[],company:null,loaded:{},view:'list',editId:null,draft:null,
  saving:false,dirty:false,libEdit:null,delArmed:false,q:'',err:'',loadP:null};

/* ---------- helpers ---------- */
function toast(msg,ms){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true},ms||2600)}
function lines(t){return String(t||'').split('\n').map(function(s){return s.trim()}).filter(Boolean)}
function parseD(s){var p=String(s||'').slice(0,10).split('-').map(Number);return p.length===3&&p[0]?new Date(Date.UTC(p[0],p[1]-1,p[2])):null}
function fmtDate(s){var d=parseD(s);if(!d)return '';var f=function(o){return new Intl.DateTimeFormat('en-GB',Object.assign({timeZone:'UTC'},o)).format(d)};return f({day:'numeric'})+' '+f({month:'long'})+' , '+f({year:'numeric'})+' ,'+f({weekday:'long'})}
// "18 Nov" for the day headings; day i of the trip = arrival date + i
function dayLabel(d,i){var a=parseD(d.arrival),t='Day '+(i+1);if(!a)return t;var x=new Date(a.getTime()+i*864e5);return t+' ('+new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',timeZone:'UTC'}).format(x)+')'}
// Name prefixes: these defaults plus any "Name prefix" item added on the Standard text page.
var BASE_PREFIXES=['Mr.','Mrs.','Ms.','Miss','Dr.'];
function prefixList(){
  var out=BASE_PREFIXES.slice();
  S.snippets.forEach(function(x){if(x.kind==='prefix'&&x.title&&out.indexOf(x.title)<0)out.push(x.title)});
  return out;
}
// Booking agents: the names in AGENTS plus any "Booking agent" item added on the Standard text page.
function agentList(){
  var out=AGENTS.slice();
  S.snippets.forEach(function(x){if(x.kind==='agent'&&x.title&&out.indexOf(x.title)<0)out.push(x.title)});
  return out;
}
function guestFull(d){return [d.title,d.guestName].filter(Boolean).join(' ').trim()}
// File name for PDF / download.
//   same month:  NAME_DD(A)_DD(B)_MM_NO     e.g. Mrs_Hiruni_Wasana_07_12_11_260001
//   across months: NAME_DD(A)_MM(A)_DD(B)_MM(B)_NO
function fileBase(d){
  var nm=String(guestFull(d)||'guest').trim().replace(/[^A-Za-z0-9\u0E00-\u0E7F]+/g,'_').replace(/^_+|_+$/g,'')||'guest';
  var a=String(d.arrival||'').slice(0,10).split('-'),b=String(d.departure||'').slice(0,10).split('-');
  var parts=[nm];
  if(a.length===3&&a[2]){
    if(b.length===3&&b[2]){parts=parts.concat(a[1]===b[1]?[a[2],b[2],a[1]]:[a[2],a[1],b[2],b[1]])}
    else parts=parts.concat([a[2],a[1]]);
  }
  parts.push(d.number||'');
  return parts.join('_');
}
function fmtShort(s){var d=parseD(s);return d?new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(d):''}
function today(){return new Intl.DateTimeFormat('en-CA').format(new Date())}
function company(){return Object.assign({},CO_DEFAULT,S.company||{})}
// Itinerary number = YY + 4-digit running number (260001, 260002 ...). The count restarts at 0001 each new year.
function nextNumber(){
  var base=(+today().slice(2,4))*10000;
  var used=S.itineraries.map(function(i){return +i.number||0}).filter(function(n){return n>base&&n<=base+9999});
  return Math.max.apply(null,[base].concat(used))+1;
}
function clone(o){return JSON.parse(JSON.stringify(o))}
function byName(a,b){return String(a.name||a.title||'').localeCompare(String(b.name||b.title||''))}

function newDraft(){
  var pick=function(k){var s=S.snippets.filter(function(x){return x.kind===k})[0];return s?s.body:''};
  return {number:nextNumber(),issueDate:today(),title:'',guestName:'',arrival:'',departure:'',adults:'',child:'',infant:'',guests:[],
    days:[{text:''}],
    transport:[],
    hotels:[],
    hotelCond:pick('hotelCond'),meals:pick('meals'),sim:'',agent:'',terms:pick('terms')};
}

/* ---------- document (preview, download, text) ---------- */
// One line of a day:  "Pick-up (08.00 AM) | Safari"  -> time column + activity.
//   "- text" = sub-item under the activity above.  A line "Pick-up (09.00 AM)" on its own
//   followed by an activity (older itineraries) is joined to that activity.
function parseDay(text){
  var raw=lines(text),rows=[],i=0;
  while(i<raw.length){
    var l=raw[i],m;
    if(/^-\s+/.test(l)){rows.push({sub:true,text:l.replace(/^-\s+/,'')});i++;continue}
    if((m=/^pick[\s-]?up\s*(\([^()|]+\))$/i.exec(l))&&i+1<raw.length&&!/^-\s+/.test(raw[i+1])&&raw[i+1].indexOf(' | ')<0&&!/^pick[\s-]?up\s*\([^()|]+\)$/i.test(raw[i+1])){
      rows.push({label:'Pick-up',time:m[1],text:raw[i+1]});i+=2;continue;
    }
    var k=l.indexOf(' | ');
    if(k>=0){
      var head=l.slice(0,k).trim(),body=l.slice(k+3).trim(),p=head.indexOf('(');
      rows.push(p>0?{label:head.slice(0,p).trim(),time:head.slice(p),text:body}:{label:'',time:head,text:body});
    }else rows.push({text:l});
    i++;
  }
  return rows;
}
function dayRowsHTML(text){
  var prev='',out='';
  parseDay(text).forEach(function(r){
    if(r.sub){out+='<div class="p-ln"><div class="p-t"></div><div class="p-x p-sub">'+esc(r.text)+'</div></div>';return}
    if(r.label&&r.label!==prev)out+='<div class="p-ln"><div class="p-t">'+esc(r.label)+'</div><div></div></div>';
    prev=r.time?r.label:'';
    out+='<div class="p-ln"><div class="p-t">'+esc(r.time||'')+'</div><div class="p-x">'+esc(r.text)+'</div></div>';
  });
  return out;
}
// Names of the people in the tour group, one per line in the form, numbered on the paper.
function memberList(d){return (d.guests||[]).filter(function(g){return g&&(g.n||g.p)})}
function membersHTML(d){
  var m=memberList(d);if(!m.length)return '';
  return '<hr class="p-rule"><div class="p-gl-title">Guest List</div><table class="p-tbl"><thead><tr><th>No.</th><th>Name</th><th>Passport No.</th></tr></thead><tbody>'+
    m.map(function(g,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(g.n||'')+'</td><td>'+esc(g.p||'')+'</td></tr>'}).join('')+'</tbody></table>';
}
function docHTML(d,c){
  var row=function(k,v){return '<div class="p-row"><div>'+esc(k)+'</div><div>'+esc(v)+'</div></div>'};
  var days=(d.days||[]).map(function(x,i){return '<div class="p-day"><h4>'+esc(dayLabel(d,i))+'</h4>'+dayRowsHTML(x.text)+'</div>'}).join('');
  var tr=(d.transport||[]).filter(function(p){return p.k||p.v}).map(function(p){return row(p.k,p.v)}).join('');
  var ho=(d.hotels||[]).filter(function(p){return p.v}).map(function(p){return row(p.k+' Hotel',p.v)}).join('');
  return '<div class="sheet" style="--wm-x:'+WM.x+'%;--wm-y:'+WM.y+'%;--wm-s:'+WM.size+'%;--wm-o:'+WM.opacity+'">'+
   '<div class="p-top"><div class="p-brand">'+esc(c.brand)+'</div><div class="p-meta">'+esc(fmtDate(d.issueDate))+'<b>Itinerary Number</b><b>'+esc(d.number)+'</b></div></div>'+

var _assetCache={};
function assetData(url){
  if(_assetCache[url])return _assetCache[url];
  _assetCache[url]=fetch(url).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){
    return new Promise(function(ok){var fr=new FileReader();fr.onload=function(){ok(fr.result)};fr.onerror=function(){ok(url)};fr.readAsDataURL(b)});
  }).catch(function(){return url});
  return _assetCache[url];
}
function bandData(){return assetData(BAND_URL)}

  (d.days||[]).forEach(function(x,i){o.push(dayLabel(d,i));parseDay(x.text).forEach(function(r){o.push(r.sub?'    - '+r.text:'- '+((r.label?r.label+' ':'')+(r.time?r.time+' ':'')+r.text).trim())});o.push('')});
  (d.transport||[]).forEach(function(p){if(p.k||p.v)o.push(p.k+': '+p.v)});o.push('');
  (d.hotels||[]).forEach(function(p){if(p.v)o.push(p.k+' Hotel: '+p.v)});
  if(d.hotelCond)o.push('',d.hotelCond);
  if(memberList(d).length){o.push('','Guest List:');memberList(d).forEach(function(g,k){o.push((k+1)+'. '+(g.n||'')+(g.p?'  Passport: '+g.p:''))})}

function api(method,url,body){
  var ctl=new AbortController();var tm=setTimeout(function(){ctl.abort()},25000);
  return fetch(url,{method:method,headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined,signal:ctl.signal})
    .then(function(r){return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok){var er=new Error(j.error||('HTTP '+r.status));er.status=r.status;throw er}return j;
    })})
    .catch(function(e){if(e&&e.name==='AbortError')throw new Error('The request timed out. Check your connection and try again.');throw e})
    .finally(function(){clearTimeout(tm)});
}
function loadKind(k){
  var url=k==='itineraries'?'/api/itineraries':'/api/lib/'+k;
  return api('GET',url).then(function(list){S[k]=list;S.loaded[k]=true;S.err=''}).catch(function(e){S.err=e.message}).then(function(){renderBanner();onData()});
}

// Wait until tours, hotels, standard text and the itinerary list have loaded, so forms never open with empty dropdowns.
function ensureReady(){
  return (S.loadP||Promise.resolve()).then(function(){
    var need=KINDS.filter(function(k){return !S.loaded[k]});
    return need.length?Promise.all(need.map(loadKind)):null;

}

// One day per date from arrival to departure. Runs by itself when either date changes (auto=true).
function genDays(auto){
  var a=parseD(S.draft.arrival),b=parseD(S.draft.departure);
  if(!a||!b||b<a){if(!auto)toast('Enter valid arrival and departure dates first');else{$('#days').innerHTML=daysHTML();touch()}return}
  var n=Math.min(Math.round((b-a)/864e5)+1,30);
  var lost=S.draft.days.slice(Math.max(n,1)).filter(function(x){return x.text.trim()}).length;
  if(lost&&!window.confirm('This removes '+lost+' day(s) that already have text. Continue?')){$('#days').innerHTML=daysHTML();touch();return}
  while(S.draft.days.length<n)S.draft.days.push({text:''});
  S.draft.days.length=Math.max(n,1);
  $('#days').innerHTML=daysHTML();touch();
}

    var f=t.getAttribute('data-snip');
    if(S.draft[f]&&S.draft[f].trim()&&S.draft[f]!==s.body&&!window.confirm('Replace the current text with this standard text?')){t.value='';return}
    S.draft[f]=s.body||'';
    var ta=$('[data-f="'+f+'"]');if(ta)ta.value=S.draft[f];t.value='';touch();
  }
});
window.addEventListener('beforeunload',function(e){if(S.view==='editor'&&S.dirty){e.preventDefault();e.returnValue=''}});
window.addEventListener('hashchange',function(){
  var h=location.hash.slice(1);if(VIEWS[h]&&h!=='editor'&&h!==S.view){S.view=h;render()}
});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&S.view!=='editor'){if(S.view==='list')loadKind('itineraries');else if(LIBS[S.view])loadKind(S.view)}
});

/* ---------- start ---------- */
(function(){
  var h=location.hash.slice(1);if(VIEWS[h]&&h!=='editor')S.view=h;
  function isDark(){var t=document.documentElement.getAttribute('data-theme');return t?t==='dark':window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches}
  function paintTheme(){var b=$('#themeBtn');if(b){var d=isDark();b.textContent=d?'\u2600 Light mode':'\u263E Dark mode';b.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode')}}
  $('#themeBtn').addEventListener('click',function(){
    var next=isDark()?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('theme',next)}catch(e){}
    paintTheme();
  });
  paintTheme();
  $('#ver').textContent=VERSION;
  render();
  fetch('/company.json').then(function(r){return r.ok?r.json():null}).then(function(c){
    if(c){S.company=c;if(S.view==='editor')VIEWS.editor.preview()}
  }).catch(function(){});
  loadAll();
})();
})();
</script>
</body>
</html>
